<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site" id="top">

        <p class="popup-pos label" id="popup-pos"></p>
        <button type="button" class="btn btn-quiet btn-icon" id="popup-close" aria-label="Close"></button>
      </div>
      <div class="popup-body" id="popup-body"></div>
      <div class="popup-actions">
        <div class="popup-step">
          <button type="button" class="btn btn-secondary btn-icon" id="popup-prev" aria-label="Previous project"></button>
          <button type="button" class="btn btn-secondary btn-icon" id="popup-next" aria-label="Next project"></button>

        <a class="btn btn-secondary" id="popup-full" href="#">Open full page</a>
        <a class="btn btn-primary" href="https://upwork.com/freelancers/~01f89f51335cb70c85" data-hire target="_blank" rel="noopener">Hire me</a>
      </div>
    </div>
  </dialog>

  <!-- Image viewer for the project page gallery -->
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-caption">
    <div class="viewer-inner">
      <div class="viewer-bar">
        <p class="viewer-count" id="viewer-count"></p>
        <button type="button" class="btn btn-on-dark btn-icon" id="viewer-close" aria-label="Close image"></button>
      </div>
      <div class="viewer-stage" id="viewer-stage">
        <img id="viewer-img" alt="">
      </div>
      <div class="viewer-foot">

        <p class="viewer-caption" id="viewer-caption"></p>
